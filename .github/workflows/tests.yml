name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    # The Core half of the mod has no game dependency. The test project targets
    # net472 (same as the mod), which needs a Windows runner or Mono to execute.
    # (Tests that need an installed copy of Rain World skip themselves.)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Hunted.Tests/Hunted.Tests.csproj --configuration Release
      # The headless arena has no game dependency either: build it and run a short round.
      - run: dotnet run --project tools/Hunted.Arena --configuration Release -- --instances 2 --episodes 20 --eval 10 --quiet --out ${{ runner.temp }}/arena
